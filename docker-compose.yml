# Quant Engine — Dockerization V2 (24/7 production)
#
# Schedulers are NOT on web_api (uvicorn --workers 2 would double-fire jobs).
#   • Value alerts  → telegram_bot  (ENABLE_VALUE_SCHEDULER=true)
#   • Settlement    → settlement_worker
#   • Data monitor  → data_monitor_worker
#
# Usage:
#   cp .env.example .env   # fill DOMAIN, TELEGRAM_*, SIGNAL_*
#   ./deploy.sh
#   # or: docker compose up -d
#   # SSL: see DEPLOY.md (certbot profile)

services:
  web_api:
    build: .
    image: score-quant:latest
    container_name: score-web
    command: >
      uvicorn src.api.main:app
      --host 0.0.0.0
      --port 8000
      --workers 2
    env_file:
      - .env
    environment:
      # Multi-worker: never run APScheduler in FastAPI lifespan here
      ENABLE_VALUE_SCHEDULER: "false"
      ENABLE_SETTLE_SCHEDULER: "false"
      TELEGRAM_AUTH_DISABLED: ${TELEGRAM_AUTH_DISABLED:-false}
      WEBAPP_URL: ${WEBAPP_URL}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    expose:
      - "8000"
    networks:
      - score-net
    restart: unless-stopped

  data_monitor_worker:
    # Reuse image built by web_api — avoids BuildKit race on shared tag
    image: score-quant:latest
    container_name: score-data-monitor
    command: python -m src.workers.data_monitor
    env_file:
      - .env
    environment:
      DATA_MONITOR_INTERVAL_MINUTES: ${DATA_MONITOR_INTERVAL_MINUTES:-15}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - score-net
    restart: unless-stopped

  settlement_worker:
    image: score-quant:latest
    container_name: score-settlement
    command: python -m src.workers.settlement_worker
    env_file:
      - .env
    environment:
      SETTLE_INTERVAL_MINUTES: ${SETTLE_INTERVAL_MINUTES:-30}
      ENABLE_VALUE_SCHEDULER: "false"
      ENABLE_SETTLE_SCHEDULER: "false"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - score-net
    restart: unless-stopped

  telegram_bot:
    image: score-quant:latest
    container_name: score-bot
    # WebApp launcher + value alerts (EV / data-score thresholds via env).
    # Settlement stays on settlement_worker — forced off here.
    command: python -m src.bot.telegram_bot
    env_file:
      - .env
    environment:
      ENABLE_VALUE_SCHEDULER: ${ENABLE_VALUE_SCHEDULER:-true}
      ENABLE_SETTLE_SCHEDULER: "false"
      SIGNAL_MIN_EV: ${SIGNAL_MIN_EV:-5}
      SIGNAL_MIN_DATA_SCORE: ${SIGNAL_MIN_DATA_SCORE:-75}
      WEBAPP_URL: ${WEBAPP_URL}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    depends_on:
      - web_api
    networks:
      - score-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: score-nginx
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      # Official nginx image runs envsubst on *.template → conf.d/
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web_api
    networks:
      - score-net
    restart: unless-stopped

  # Optional Certbot companion — enable with: docker compose --profile certs run --rm certbot ...
  # See DEPLOY.md for issue / renew commands.
  certbot:
    image: certbot/certbot:latest
    container_name: score-certbot
    profiles: ["certs"]
    volumes:
      - ./nginx/certbot/www:/var/www/certbot
      - ./nginx/certbot/conf:/etc/letsencrypt
    networks:
      - score-net

networks:
  score-net:
    driver: bridge
