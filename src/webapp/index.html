<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Soi Kèo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            tg: {
              bg: "var(--tg-theme-bg-color, #0f1419)",
              text: "var(--tg-theme-text-color, #e7ecf1)",
              hint: "var(--tg-theme-hint-color, #8b98a5)",
              link: "var(--tg-theme-link-color, #6ab3f3)",
              btn: "var(--tg-theme-button-color, #2aabee)",
              btnText: "var(--tg-theme-button-text-color, #ffffff)",
              secondary: "var(--tg-theme-secondary-bg-color, #1c2128)",
            },
          },
        },
      },
    };
  </script>
  <style>
    body { background: var(--tg-theme-bg-color, #0f1419); color: var(--tg-theme-text-color, #e7ecf1); }
    .tab-active { background: var(--tg-theme-button-color, #2aabee); color: var(--tg-theme-button-text-color, #fff); }
    .card { background: var(--tg-theme-secondary-bg-color, #1c2128); }
    .modal-backdrop { background: rgba(0,0,0,.55); }
    .nav-active { color: var(--tg-theme-button-color, #2aabee); border-bottom-color: var(--tg-theme-button-color, #2aabee); }
  </style>
</head>
<body class="min-h-screen pb-8">
  <header class="sticky top-0 z-20 px-4 py-3 border-b border-white/10 backdrop-blur bg-[color:var(--tg-theme-bg-color,#0f1419)]/95">
    <div class="flex items-center justify-between gap-3">
      <div>
        <p class="text-xs text-tg-hint">Xin chào</p>
        <h1 id="user-name" class="text-lg font-semibold leading-tight">Bạn</h1>
      </div>
      <button id="btn-refresh" class="text-sm px-3 py-1.5 rounded-lg bg-tg-btn text-tg-btnText font-medium">Làm mới</button>
    </div>
    <nav id="main-nav" class="mt-3 flex gap-4 text-sm border-b border-white/5">
      <button type="button" data-view="bets" class="nav-tab nav-active pb-2 border-b-2 border-transparent font-medium">Kèo hời</button>
      <button type="button" data-view="journal" class="nav-tab pb-2 border-b-2 border-transparent text-tg-hint font-medium">Nhật Ký Cược</button>
    </nav>
    <div id="tabs" class="mt-3 flex gap-1.5 overflow-x-auto text-xs no-scrollbar">
      <button data-market="ALL" class="tab tab-active shrink-0 px-3 py-1.5 rounded-full">Tất cả</button>
      <button data-market="1X2" class="tab shrink-0 px-3 py-1.5 rounded-full bg-white/5 text-tg-hint">1X2</button>
      <button data-market="AH" class="tab shrink-0 px-3 py-1.5 rounded-full bg-white/5 text-tg-hint">AH/Chấp</button>
      <button data-market="OU" class="tab shrink-0 px-3 py-1.5 rounded-full bg-white/5 text-tg-hint">Tài Xỉu</button>
      <button data-market="Corners" class="tab shrink-0 px-3 py-1.5 rounded-full bg-white/5 text-tg-hint">Corners</button>
    </div>
  </header>

  <main class="px-4 pt-3 space-y-3">
    <section id="view-bets">
      <p id="status" class="text-sm text-tg-hint">Đang tải kèo hời…</p>
      <div id="bets" class="space-y-3"></div>
    </section>

    <section id="view-journal" class="hidden space-y-3">
      <div id="perf-card" class="card rounded-xl p-4 border border-white/5">
        <p class="text-sm font-semibold mb-3">Hiệu suất paper</p>
        <p id="perf-status" class="text-xs text-tg-hint">Đang tải…</p>
        <div id="perf-metrics" class="hidden grid grid-cols-3 gap-3 text-center">
          <div>
            <p class="text-[11px] text-tg-hint uppercase tracking-wide">Win Rate</p>
            <p id="perf-winrate" class="text-lg font-semibold mt-0.5">—</p>
          </div>
          <div>
            <p class="text-[11px] text-tg-hint uppercase tracking-wide">PnL</p>
            <p id="perf-pnl" class="text-lg font-semibold mt-0.5">—</p>
          </div>
          <div>
            <p class="text-[11px] text-tg-hint uppercase tracking-wide">ROI</p>
            <p id="perf-roi" class="text-lg font-semibold mt-0.5">—</p>
          </div>
        </div>
        <p id="perf-meta" class="mt-3 text-xs text-tg-hint hidden"></p>
      </div>
      <p class="text-xs text-tg-hint">Số liệu từ cược đã settle trong journal (live_bets).</p>
    </section>
  </main>

  <div id="modal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center modal-backdrop p-3">
    <div class="card w-full max-w-lg max-h-[85vh] overflow-y-auto rounded-2xl p-4 shadow-xl">
      <div class="flex items-start justify-between gap-2 mb-3">
        <h2 id="modal-title" class="text-base font-semibold">Hồ sơ đội</h2>
        <button id="modal-close" class="text-tg-hint text-xl leading-none px-2">&times;</button>
      </div>
      <div id="modal-body" class="space-y-4 text-sm"></div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
